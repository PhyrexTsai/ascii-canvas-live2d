<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ascii-canvas-live2d demo</title>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>&lt;ascii-canvas-live2d&gt;</h1>
      <p class="sub">
        Live2D model → hidden canvas → &lt;ascii-canvas&gt; · cubism4 only
      </p>
    </header>
    <nav class="controls">
      <span id="fps">— fps</span>
      <span id="size">—</span>
      <label>
        ramp
        <select id="ramp">
          <option value=" .:-=+*#%@">default</option>
          <option value=" .,:ilwW">soft</option>
          <option value=" ░▒▓█">blocks</option>
          <option
            value=" .'`^,:;Il!i&gt;&lt;~+_-?][}{1)(|\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&amp;8%B@$"
          >
            verbose
          </option>
        </select>
      </label>
      <label>
        zoom
        <input id="zoom" type="range" min="1" max="10" step="0.1" value="2" />
        <span id="zoom-val">2.0×</span>
      </label>
      <label>
        y-offset
        <input
          id="yoffset"
          type="range"
          min="-0.3"
          max="0.3"
          step="0.02"
          value="-0.10"
        />
        <span id="yoffset-val">-0.10</span>
      </label>
      <label>
        cell
        <input id="cell" type="range" min="4" max="20" step="1" value="7" />
        <span id="cell-val">7 × 12</span>
      </label>
      <label>
        motion
        <select id="motion-group" disabled>
          <option>—</option>
        </select>
        <button id="motion-play" type="button" disabled>▶ play</button>
      </label>
      <label>
        expression
        <select id="expression" disabled>
          <option value="">none</option>
        </select>
      </label>
    </nav>
    <main>
      <section class="pane">
        <h2>Output</h2>
        <ascii-canvas-live2d
          id="stage"
          model-url="/assets/live2d/Mao/Mao.model3.json"
          ramp=" .:-=+*#%@"
          cell-w="7"
          cell-h="12"
          font-px="11"
          alpha-threshold="16"
          zoom="2"
          y-offset="-0.1"
        ></ascii-canvas-live2d>
      </section>
    </main>
    <aside class="attribution">
      Model: <strong>Mao</strong> &copy; Live2D Inc. — Cubism SDK sample, used under the
      <a
        href="https://www.live2d.com/eula/live2d-free-material-license-agreement_en.html"
        target="_blank"
        rel="noopener"
        >Free Material License Agreement</a
      >.
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
